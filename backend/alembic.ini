# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path
prepend_sys_path = .

# timezone
timezone =

# max length of characters
truncat_slug_length = 64

# revision_environment = false

# sourceless = false

# path separator
path_separator = os

# recursive_version_locations = false

# output encoding
output_encoding = utf-8

# database URL
sqlalchemy.url = mysql+pymysql://root:123456@localhost:3307/mydb


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S